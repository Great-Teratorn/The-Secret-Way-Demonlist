    <script>        window.handleSearchTyping = function(val) {            var dropdown = document.getElementById('searchDropdownMenu');            if (!dropdown) { return; }            var query = val.toLowerCase().trim();            if (query.length < 2) { dropdown.style.display = 'none'; return; }            var rawElements = document.querySelectorAll('.list button, .list-container a, .list a, td, th, .player-cell, h3');            var uniqueMatches = [];            rawElements.forEach(function(el) {                var text = el.textContent.trim();                if (text.length > 1 && !/^\d+$/.test(text) && text.toLowerCase().indexOf(query) !== -1) {                    if (uniqueMatches.indexOf(text) === -1) { uniqueMatches.push(text); }                }            });            var topMatches = uniqueMatches.slice(0, 6);            if (topMatches.length === 0) { dropdown.style.display = 'none'; return; }            var html = '';            topMatches.forEach(function(name) {                var typeLabel = window.location.hash.includes('/leaderboard') ? 'Player' : 'Item';                html += '<div class="suggestion-row" onclick="localStorage.setItem(\'listSearchTarget\', \'' + name.replace(/'/g, "\\'") + '\'); document.getElementById(\'searchDropdownMenu\').style.display=\'none\'; document.getElementById(\'levelSearch\').value=\'\'; window.dispatchEvent(new HashChangeEvent(\'hashchange\'));" style="display:flex; justify-content:space-between; padding:10px 14px; cursor:pointer; background:#14141c; border-bottom:1px solid rgba(255,255,255,0.05); text-align:left;"><span style="color:#fff; font-size:0.9rem;">' + name + '</span><span style="color:#00e676; font-size:0.7rem; font-weight:bold; text-transform:uppercase;">' + typeLabel + '</span></div>';            });            dropdown.innerHTML = html;            dropdown.style.display = 'block';        };
        window.processSearchHighlight = function() {            var target = localStorage.getItem('listSearchTarget');            if (!target) { return; }            var query = target.toLowerCase().trim();            localStorage.removeItem('listSearchTarget');            var attempts = 0;            var loop = setInterval(function() {                attempts++;                var elements = document.querySelectorAll('.list button, .list-container a, .list a, td, th, .player-cell');                if (elements.length > 0) {                    clearInterval(loop);                    elements.forEach(function(el) {                        if (el.textContent.toLowerCase().indexOf(query) !== -1) {                            el.style.setProperty('border', '2px dashed #00e676', 'important');                            el.style.setProperty('background', 'rgba(0, 230, 118, 0.15)', 'important');                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });                            if (typeof el.click === 'function') { el.click(); }                        }                    });                }                if (attempts > 20) { clearInterval(loop); }            }, 150);        };
        document.addEventListener('click', function(e) {            if (e.target.closest('#welcomeSearchBtn')) {                e.preventDefault();                var box = document.getElementById('welcomeSearchBox');                var inp = document.getElementById('levelSearch');                if (box && inp) {                    box.classList.toggle('active');                    if (box.classList.contains('active')) { inp.focus(); } else { inp.value = ''; var dd = document.getElementById('searchDropdownMenu'); if (dd) { dd.style.display = 'none'; } }                }            }        });
        document.addEventListener('input', function(e) {            if (e.target && e.target.id === 'levelSearch') { window.handleSearchTyping(e.target.value); }        });
        document.addEventListener('keydown', function(e) {            if (e.target && e.target.id === 'levelSearch' && e.key === 'Enter') {                if (e.target.value.trim().length > 0) {                    localStorage.setItem('listSearchTarget', e.target.value.trim());                    if (!window.location.hash.includes('/list')) { window.location.hash = '/list'; } else { window.dispatchEvent(new HashChangeEvent('hashchange')); }                }            }        });
        window.addEventListener('hashchange', function() { window.processSearchHighlight(); });        window.addEventListener('load', function() { window.processSearchHighlight(); });    </script>
