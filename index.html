    <script>        var searchDatabaseRegistry = [];
        function loadSearchMatrix() {            searchDatabaseRegistry = [];            var baseDir = window.location.origin + window.location.pathname;            if (baseDir.slice(-1) !== '/') { baseDir += '/'; }                        fetch(baseDir + 'data/list.json')                .then(function(r) { return r.json(); })                .then(function(data) {                    data.forEach(function(lvl) {                        searchDatabaseRegistry.push({ name: lvl.name, type: 'Level', route: '/list' });                        if (lvl.author) { searchDatabaseRegistry.push({ name: lvl.author, type: 'Creator', route: '/list' }); }                        if (lvl.verifier) { searchDatabaseRegistry.push({ name: lvl.verifier, type: 'Verifier', route: '/list' }); }                    });                }).catch(function(e) {});
            fetch(baseDir + 'data/leaderboard.json')                .then(function(r) { return r.json(); })                .then(function(data) {                    data.forEach(function(p) {                        searchDatabaseRegistry.push({ name: p.name, type: 'Player', route: '/leaderboard' });                    });                }).catch(function(e) {});        }
        loadSearchMatrix();
        window.handleLiveMatrix = function(val) {            var container = document.getElementById('welcomeLiveResults');            if (!container) { return; }            var query = val.toLowerCase().trim();                        if (query.length < 3) {                container.innerHTML = '';                return;            }
            var matches = searchDatabaseRegistry.filter(function(item) {                return item.name.toLowerCase().indexOf(query) !== -1;            });
            var uniqueMatches = matches.filter(function(v, i, a) {                return a.findIndex(function(t) { return t.name === v.name && t.type === v.type; }) === i;            }).slice(0, 4);
            if (uniqueMatches.length === 0) {                container.innerHTML = '<span style="font-size:0.85rem; color:rgba(255,255,255,0.4); font-style:italic;">No matches found...</span>';                return;            }
            var html = '';            uniqueMatches.forEach(function(item) {                var badgeColor = item.type === 'Player' ? '#2196f3' : '#00e676';                html += '<div onclick="localStorage.setItem(\'listSearchTarget\', \'' + item.name.replace(/'/g, "\\'") + '\'); var r=document.getElementById(\'welcomeLiveResults\'); if(r)r.innerHTML=\'\'; var inp=document.getElementById(\'levelSearch\'); if(inp)inp.value=\'\'; window.location.hash=\'' + item.route + '\';" style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 16px; cursor: pointer; transition: all 0.2s; gap: 8px;"><span style="color:#fff; font-size:0.85rem; font-weight:500;">' + item.name + '</span><span style="font-size:0.65rem; font-weight:bold; text-transform:uppercase; color:' + badgeColor + '; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">' + item.type + '</span></div>';            });            container.innerHTML = html;        };
        window.processSearchHighlight = function() {            var target = localStorage.getItem('listSearchTarget');            if (!target) { return; }            var query = target.toLowerCase().trim();            localStorage.removeItem('listSearchTarget');            var attempts = 0;            var loop = setInterval(function() {                attempts++;                var isLeaderboard = window.location.hash.includes('/leaderboard');                var targetClass = isLeaderboard ? 'td, th, .player, [class*="player"]' : '.list button, .list-container a, .list a, [class*="item"] button';                var elements = document.querySelectorAll(targetClass);                if (elements.length > 0) {                    clearInterval(loop);                    elements.forEach(function(el) {                        el.style.removeProperty('border');                        el.style.removeProperty('background');                    });                    elements.forEach(function(el) {                        if (el.textContent.toLowerCase().indexOf(query) !== -1) {                            el.style.setProperty('border', '2px dashed #00e676', 'important');                            el.style.setProperty('background', 'rgba(0, 230, 118, 0.15)', 'important');                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });                            if (typeof el.click === 'function') { el.click(); }                        }                    });                }                if (attempts > 20) { clearInterval(loop); }            }, 150);        };
        window.addEventListener('hashchange', function() { window.processSearchHighlight(); });        window.addEventListener('load', function() { window.processSearchHighlight(); });    </script>
