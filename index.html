    <script>        var searchDatabaseRegistry = [];
        function loadSearchMatrix() {            searchDatabaseRegistry = [];            var baseDir = window.location.origin + window.location.pathname;            if (baseDir.slice(-1) !== '/') { baseDir += '/'; }                        fetch(baseDir + 'data/list.json')                .then(function(r) { return r.json(); })                .then(function(data) {                    data.forEach(function(lvl) {                        searchDatabaseRegistry.push(lvl.name + ' (Level)');                        if (lvl.author && searchDatabaseRegistry.indexOf(lvl.author + ' (Creator)') === -1) {                             searchDatabaseRegistry.push(lvl.author + ' (Creator)');                         }                        if (lvl.verifier && searchDatabaseRegistry.indexOf(lvl.verifier + ' (Verifier)') === -1) {                             searchDatabaseRegistry.push(lvl.verifier + ' (Verifier)');                         }                    });                }).catch(function(e) {});
            fetch(baseDir + 'data/leaderboard.json')                .then(function(r) { return r.json(); })                .then(function(data) {                    data.forEach(function(p) {                        if (searchDatabaseRegistry.indexOf(p.name + ' (Player)') === -1) {                            searchDatabaseRegistry.push(p.name + ' (Player)');                        }                    });                }).catch(function(e) {});        }
        loadSearchMatrix();
        window.nativeSearchTyping = function(val) {            var listContainer = document.getElementById('searchAutocomplete');            if (!listContainer) { return; }            var query = val.toLowerCase().trim();            if (query.length < 3) {                listContainer.innerHTML = '';                return;            }            var matches = searchDatabaseRegistry.filter(function(item) {                return item.toLowerCase().indexOf(query) !== -1;            }).slice(0, 6);            var html = '';            matches.forEach(function(match) {                html += '<option value="' + match + '">';            });            listContainer.innerHTML = html;        };
        window.processSearchHighlight = function() {            var target = localStorage.getItem('listSearchTarget');            if (!target) { return; }            var query = target.replace(/\s\([^)]+\)$/, '').toLowerCase().trim();            localStorage.removeItem('listSearchTarget');            var attempts = 0;            var loop = setInterval(function() {                attempts++;                var isLeaderboard = window.location.hash.includes('/leaderboard');                var targetClass = isLeaderboard ? 'td, th, .player, [class*="player"]' : '.list button, .list-container a, .list a, [class*="item"] button';                var elements = document.querySelectorAll(targetClass);                if (elements.length > 0) {                    clearInterval(loop);                    elements.forEach(function(el) {                        el.style.removeProperty('border');                        el.style.removeProperty('background');                    });                    elements.forEach(function(el) {                        if (el.textContent.toLowerCase().indexOf(query) !== -1) {                            el.style.setProperty('border', '2px dashed #00e676', 'important');                            el.style.setProperty('background', 'rgba(0, 230, 118, 0.15)', 'important');                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });                            if (typeof el.click === 'function') { el.click(); }                        }                    });                }                if (attempts > 20) { clearInterval(loop); }            }, 150);        };
        document.addEventListener('keydown', function(e) {            if (e.target && e.target.id === 'levelSearch' && e.key === 'Enter') {                var inputVal = e.target.value.trim();                if (inputVal.length > 0) {                    localStorage.setItem('listSearchTarget', inputVal);                    var destinationRoute = inputVal.indexOf('(Player)') !== -1 ? '/leaderboard' : '/list';                    if (window.location.hash !== destinationRoute) {                        window.location.hash = destinationRoute;                    } else {                        window.processSearchHighlight();                    }                    e.target.value = '';                }            }        });
        window.addEventListener('hashchange', function() { window.processSearchHighlight(); });        window.addEventListener('load', function() { window.processSearchHighlight(); });    </script>
