    <script>        var searchRegistry = [];
        function loadSearchData() {            searchRegistry = [];                        // GitHub Pages repository subfolder URL path configuration            fetch('/The-Secret-Way-Demonlist/data/list.json')                .then(function(res) { return res.json(); })                .then(function(data) {                    data.forEach(function(item) {                        searchRegistry.push({ name: item.name, type: 'Level', route: '/list' });                        if (item.author) searchRegistry.push({ name: item.author, type: 'Creator', route: '/list' });                        if (item.verifier) searchRegistry.push({ name: item.verifier, type: 'Verifier', route: '/list' });                    });                })                .catch(function(err) {});
            fetch('/The-Secret-Way-Demonlist/data/leaderboard.json')                .then(function(res) { return res.json(); })                .then(function(data) {                    data.forEach(function(player) {                        searchRegistry.push({ name: player.name, type: 'Player', route: '/leaderboard' });                    });                })                .catch(function(err) {});        }
        loadSearchData();
        window.handleSearchTyping = function(val) {            var dropdown = document.getElementById('searchDropdownMenu');            if (!dropdown) return;
            var query = val.toLowerCase().trim();            if (query.length < 2) {                dropdown.style.display = 'none';                return;            }
            var matches = searchRegistry.filter(function(item) {                return item.name.toLowerCase().indexOf(query) !== -1;            });
            var uniqueMatches = matches.filter(function(v, i, a) {                return a.findIndex(function(t) { return t.name === v.name && t.type === v.type; }) === i;            }).slice(0, 6);
            if (uniqueMatches.length === 0) {                dropdown.style.display = 'none';                return;            }
            var html = '';            uniqueMatches.forEach(function(item) {                html += '<div class="suggestion-row" onclick="window.location.hash=\'' + item.route + '\'; localStorage.setItem(\'listSearchTarget\', \'' + item.name.replace(/'/g, "\\'") + '\'); document.getElementById(\'searchDropdownMenu\').style.display=\'none\'; document.getElementById(\'levelSearch\').value=\'\';" style="display:flex; justify-content:space-between; padding:10px 14px; cursor:pointer; background:#14141c; border-bottom:1px solid rgba(255,255,255,0.05); text-align:left;"><span style="color:#fff; font-size:0.9rem;">' + item.name + '</span><span style="color:#00e676; font-size:0.7rem; font-weight:bold; text-transform:uppercase;">' + item.type + '</span></div>';            });
            dropdown.innerHTML = html;            dropdown.style.display = 'block';        };
        window.handleSearchEnter = function(val) {            if (val.trim().length > 0) {                localStorage.setItem('listSearchTarget', val.trim());                window.location.hash = '/list';            }        };
        window.addEventListener('hashchange', function() {            var target = localStorage.getItem('listSearchTarget');            if (!target) return;            var query = target.toLowerCase().trim();            localStorage.removeItem('listSearchTarget');
            var attempts = 0;            var loop = setInterval(function() {                attempts++;                var elements = document.querySelectorAll('.list button, .list-container a, .list a, td, th, .player-cell');                if (elements.length > 0) {                    clearInterval(loop);                    elements.forEach(function(el) {                        if (el.textContent.toLowerCase().indexOf(query) !== -1) {                            el.style.setProperty('border', '2px dashed #00e676', 'important');                            el.style.setProperty('background', 'rgba(0, 230, 118, 0.15)', 'important');                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });                            if (typeof el.click === 'function') el.click();                        }                    });                }                if (attempts > 20) clearInterval(loop);            }, 150);        });    </script>
