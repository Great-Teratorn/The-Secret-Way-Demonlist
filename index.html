    <script>    var masterSearchRegistry = [];
    function loadIndexRegistry() {
    masterSearchRegistry = [];

    var base = window.location.origin + window.location.pathname;
    if (base.slice(-1) !== '/') {
        base += '/';
    }

    // Load the main level index.
    // _list.json contains level FILE NAMES, not level objects.
    // Each individual level JSON contains the level, creator,
    // verifier and record/player information.
    fetch(base + 'data/_list.json')
        .then(function(r) {
            return r.json();
        })
        .then(function(paths) {
            return Promise.all(
                paths.map(function(path) {
                    return fetch(base + 'data/' + path + '.json')
                        .then(function(r) {
                            return r.json();
                        })
                        .then(function(level) {

                            /*
                             * LEVEL
                             */
                            if (level.name) {
                                masterSearchRegistry.push({
                                    name: level.name,
                                    type: 'Level',
                                    route: '/list',
                                    levelName: level.name
                                });
                            }

                            /*
                             * CREATOR / AUTHOR
                             *
                             * Store the level associated with this creator.
                             * The creators array is used when available because
                             * a level can have multiple creators.
                             */
                            var creators = [];

                            if (Array.isArray(level.creators)) {
                                creators = level.creators.slice();
                            } else if (level.author) {
                                creators = [level.author];
                            }

                            creators.forEach(function(creator) {
                                if (creator) {
                                    masterSearchRegistry.push({
                                        name: creator,
                                        type: 'Creator',
                                        route: '/list',
                                        levelName: level.name
                                    });
                                }
                            });

                            /*
                             * VERIFIER
                             */
                            if (level.verifier) {
                                masterSearchRegistry.push({
                                    name: level.verifier,
                                    type: 'Verifier',
                                    route: '/list',
                                    levelName: level.name
                                });
                            }

                            /*
                             * PLAYERS
                             *
                             * Players are taken directly from the records
                             * on each level. This means a player does not
                             * need to be a verifier to appear in search.
                             */
                            if (Array.isArray(level.records)) {
                                level.records.forEach(function(record) {
                                    if (record && record.user) {
                                        masterSearchRegistry.push({
                                            name: record.user,
                                            type: 'Player',
                                            route: '/leaderboard',
                                            levelName: level.name
                                        });
                                    }
                                });
                            }
                        })
                        .catch(function(e) {
                            // Ignore individual level files that fail to load.
                        });
                })
            );
        })
        .catch(function(e) {
            console.error('Failed to load search level registry.', e);
        });
}


    loadIndexRegistry();

    /*     * ==========================================================     * SEARCH TYPING / SUGGESTIONS     * ==========================================================     */
    window.handleSearchTyping = function(val) {
    var dropdown = document.getElementById('searchDropdownMenu');
    if (!dropdown) {
        return;
    }

    var query = val.toLowerCase().trim();

    /* Keep the existing 3-character requirement */
    if (query.length < 3) {
        dropdown.style.display = 'none';
        return;
    }

    var matches = masterSearchRegistry.filter(function(item) {
        return item.name.toLowerCase().indexOf(query) !== -1;
    });

    var uniqueMatches = matches.filter(function(v, i, a) {
        return a.findIndex(function(t) {
            return t.name === v.name && t.type === v.type;
        }) === i;
    }).slice(0, 6);

    if (uniqueMatches.length === 0) {
        dropdown.style.display = 'none';
        return;
    }

    var html = '';

    uniqueMatches.forEach(function(item) {
        var safeName = item.name
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'");

        var safeType = item.type
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'");

        html +=
            '<div class="suggestion-row" ' +
            'data-search-name="' + safeName + '" ' +
            'data-search-type="' + safeType + '" ' +
            'onclick="window.selectSearchResult(this)" ' +
            'style="display:flex !important; justify-content:space-between !important; padding:12px 16px !important; cursor:pointer !important; background:#14141c !important; border-bottom:1px solid rgba(255,255,255,0.05) !important; text-align:left !important;">' +

            '<span class="suggestion-name" style="color:#fff !important; font-size:0.9rem !important; font-weight:500 !important;">' +
            item.name +
            '</span>' +

            '<span class="suggestion-type" style="color:#00e676 !important; font-size:0.7rem !important; font-weight:bold !important; text-transform:uppercase !important; background:rgba(255,255,255,0.15) !important; padding:2px 8px !important; border-radius:4px !important;">' +
            item.type +
            '</span>' +

            '</div>';
    });

    dropdown.innerHTML = html;
    dropdown.style.display = 'block';
};


window.selectSearchResult = function(element) {
    if (!element) {
        return;
    }

    var name = element.getAttribute('data-search-name');
    var type = element.getAttribute('data-search-type');

    if (!name || !type) {
        return;
    }

    console.log('Search result clicked:', name, type);

    /* Find the exact registry entry that was clicked */
    var matchedItem = masterSearchRegistry.find(function(item) {
        return item.name.toLowerCase() === name.toLowerCase() &&
               item.type === type;
    });

    if (!matchedItem) {
        console.log('No matching registry item found:', name, type);
        return;
    }

    /* Players belong on the leaderboard */
    if (matchedItem.type === 'Player') {
        localStorage.setItem('leaderboardPlayerSearch', matchedItem.name);

        if (window.location.hash !== '#/leaderboard') {
            window.location.hash = '/leaderboard';
        } else {
            window.processSearchHighlight();
        }

        return;
    }

    /* Levels, creators and verifiers use the existing list-search system */
    localStorage.setItem('listSearchTarget', matchedItem.name);

    var destinationRoute = matchedItem.route || '/list';

    if (window.location.hash !== '#' + destinationRoute) {
        window.location.hash = destinationRoute;
    } else {
        window.processSearchHighlight();
    }

    /* Close the search dropdown after selecting a result */
    var dropdown = document.getElementById('searchDropdownMenu');
    if (dropdown) {
        dropdown.style.display = 'none';
    }
};





    /*     * ==========================================================     * SEARCH ENTER / HIGHLIGHT PROCESSING     * ==========================================================     */
    window.processSearchHighlight = function() {
        /*         * PLAYER SEARCH         *         * Player searches are handled directly by leaderboard.js.         * We deliberately do NOT try to search through every record         * on the leaderboard here.         */        var playerTarget = localStorage.getItem('leaderboardPlayerSearch');
        if (playerTarget) {            return;        }

        /*         * EXISTING LEVEL / CREATOR / VERIFIER SEARCH         */        var target = localStorage.getItem('listSearchTarget');
        if (!target) {            return;        }
        var query = target.toLowerCase().trim();
        localStorage.removeItem('listSearchTarget');
        var attempts = 0;
        var loop = setInterval(function() {
            attempts++;
            var isLeaderboard = window.location.hash.includes('/leaderboard');
            var targetClass = isLeaderboard                ? 'td, th, .player, [class*="player"]'                : '.list button, .list-container a, .list a, [class*="item"] button';
            var elements = document.querySelectorAll(targetClass);
            if (elements.length > 0) {
                clearInterval(loop);
                elements.forEach(function(el) {
                    if (                        el.textContent &&                        el.textContent.toLowerCase().indexOf(query) !== -1                    ) {
                        el.style.setProperty(                            'border',                            '2px dashed #00e676',                            'important'                        );
                        el.style.setProperty(                            'background',                            'rgba(0, 230, 118, 0.15)',                            'important'                        );
                        el.scrollIntoView({                            behavior: 'smooth',                            block: 'center'                        });
                        if (typeof el.click === 'function') {                            el.click();                        }                    }                });            }
            if (attempts > 20) {                clearInterval(loop);            }
        }, 150);    };

    /*     * ==========================================================     * SEARCH BUTTON     * ==========================================================     */
    document.addEventListener('click', function(e) {
        if (e.target.closest('#welcomeSearchBtn')) {
            e.preventDefault();
            var box = document.getElementById('welcomeSearchBox');            var inp = document.getElementById('levelSearch');
            if (box && inp) {
                box.classList.toggle('active');
                if (box.classList.contains('active')) {
                    inp.focus();
                } else {
                    inp.value = '';
                    var dd = document.getElementById('searchDropdownMenu');
                    if (dd) {                        dd.style.display = 'none';                    }                }            }        }    });

    /*     * ==========================================================     * SEARCH INPUT     * ==========================================================     */
    document.addEventListener('input', function(e) {
        if (e.target && e.target.id === 'levelSearch') {            window.handleSearchTyping(e.target.value);        }
    });

    /*     * ==========================================================     * ENTER KEY     * ==========================================================     */
    document.addEventListener('keydown', function(e) {
        if (            e.target &&            e.target.id === 'levelSearch' &&            e.key === 'Enter'        ) {
            if (e.target.value.trim().length > 0) {
                var inputVal = e.target.value.trim();
                var matchedItem = masterSearchRegistry.find(function(i) {                    return i.name.toLowerCase() === inputVal.toLowerCase();                });
                /*                 * If the exact search is a player, send it to                 * the leaderboard using the new player-search key.                 */                if (matchedItem && matchedItem.type === 'Player') {
                    localStorage.setItem(                        'leaderboardPlayerSearch',                        inputVal                    );
                    if (window.location.hash !== '#/leaderboard') {                        window.location.hash = '/leaderboard';                    }
                } else {
                    /*                     * Existing behaviour for levels, creators,                     * verifiers, or unmatched searches.                     */                    localStorage.setItem(                        'listSearchTarget',                        inputVal                    );
                    var destinationRoute = matchedItem                        ? matchedItem.route                        : '/list';
                    if (window.location.hash !== '#' + destinationRoute) {                        window.location.hash = destinationRoute;                    } else {                        window.processSearchHighlight();                    }                }            }        }    });

    /*     * ==========================================================     * ROUTE CHANGES     * ==========================================================     */
    window.addEventListener('hashchange', function() {        window.processSearchHighlight();    });

    /*     * ==========================================================     * INITIAL PAGE LOAD     * ==========================================================     */
    window.addEventListener('load', function() {        window.processSearchHighlight();    });</script>
